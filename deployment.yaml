
apiVersion: apps/v1
kind: Deployment

metadata:
  name: govt-benefits-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: govt-benefits

  template:
    metadata:
      labels:
        app: govt-benefits

    spec:
      containers:
        - name: govt-benefits-container

          image: joshithachilukuri/govt-benefits-assistant:IMAGE_TAG

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
